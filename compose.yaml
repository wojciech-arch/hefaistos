# HEFAISTOS_CONFIG_DIR: folder holding config.json (HEOS host and targets).
# One container serves every target; edit config.json and restart to add or rename one.
services:
  hefaistos:
    image: hefaistos:latest
    build: .
    network_mode: host
    restart: unless-stopped
    volumes:
      - ${HEFAISTOS_CONFIG_DIR:?set HEFAISTOS_CONFIG_DIR to the folder holding config.json}:/config:ro
