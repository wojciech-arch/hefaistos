# HEFAISTOS_CONFIG_DIR: folder holding config.json (HEOS host and targets).
x-hefaistos: &hefaistos
  image: hefaistos:latest
  build: .
  network_mode: host
  volumes:
    - ${HEFAISTOS_CONFIG_DIR:?set HEFAISTOS_CONFIG_DIR to the folder holding config.json}:/config:ro

services:
  all:
    <<: *hefaistos
    restart: unless-stopped
    environment:
      HEFAISTOS_TARGET: all
    command: ["--name", "All"]
  no-kid:
    <<: *hefaistos
    restart: unless-stopped
    environment:
      HEFAISTOS_TARGET: no-kid
    command: ["--name", "No Kid"]
  cli:
    <<: *hefaistos
    profiles: [cli]
    entrypoint: ["python", "-m", "hefaistos"]
